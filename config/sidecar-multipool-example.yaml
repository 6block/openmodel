# OpenModel — multi-pool worker example (text + image generation + speech).
# One worker, several pools, each pool on its own cards with one engine.
# Layout shown for 8x 10 GB cards:
#   cards 0-3  text pool    vllm, tensor parallel (text, plus a vision model to switch to)
#   card  4    image pool   diffusion (image generation)
#   card  5    asr + tts    speech recognition and speech synthesis sharing one card
#   cards 6-7  free         add another pool here, or widen one above
# Fill the fields marked "<<<". See SP-GUIDE.md section 6 and GETTING-STARTED-SP.md.

mode: prod   # self-registration requires a real Lotus client; do not change

lotus:
  api_url: "http://127.0.0.1:1234/rpc/v0"
  api_token: "${LOTUS_API_TOKEN}"   # WalletSign needs a sign-permission token; set it in .env
  miner_address: ""            # <<< miner id, e.g. t01234 / f01234

curio:
  dsn: "host=localhost port=5433 user=yugabyte dbname=yugabyte sslmode=disable search_path=curio"
  proof_poll_interval_sec: 5
  proof_max_wait_sec: 1800
  log_path: "/tmp/curio.log"

scheduler:
  window_post:
    graceful_yield_threshold_sec: 300
    hard_stop_threshold_sec: 120
    resume_delay_after_close_sec: 60
    yield_during_fault_cutoff: false
    proof_detection_enabled: true
  winning_post:
    enabled: true
    resume_delay_sec: 30
    timeout_sec: 35
  fail_safe_on_disconnect: true

grpc:
  port: 50051

inference:
  # Settings written here are shared by every pool unless a pool sets its own.
  # engine, model, device_ids and mode are always per pool.
  api_port: 8000
  pools:
    # Text and image understanding. A vLLM pool switches between models of its
    # own kind; the vision limits below apply while the vision model is loaded.
    - name: text
      engine: "vllm"
      model: "/models/Qwen--Qwen3-32B-AWQ"
      device_ids: [0, 1, 2, 3]
      mode: "tensor_parallel"
      gpu_memory_utilization: 0.90
      max_model_len: 8192
      enforce_eager: true          # 10 GB cards: skip CUDA graphs, saves VRAM
      max_images_per_prompt: 1     # vision model: image parts per chat request
      max_image_pixels: 409600     # vision model: larger images are downscaled
      supported_models:
        - "/models/Qwen--Qwen3-32B-AWQ"
        - "/models/Qwen--Qwen3-VL-8B-Instruct"

    # Image generation (diffusers layout: model_index.json).
    - name: image
      engine: "diffusion"
      model: "/models/stabilityai--stable-diffusion-xl-base-1.0"
      device_ids: [4]
      gpu_memory_utilization: 0.90
      max_images_per_generation: 2   # images one request may ask for
      # max_steps: 50                # denoising steps one request may ask for
      # default_steps: 25            # steps when a request names none (default: 4 for turbo /
      #                              # lightning / schnell models, 25 otherwise)
      supported_models:
        - "/models/stabilityai--stable-diffusion-xl-base-1.0"
        - "/models/segmind--SSD-1B"

    # Speech recognition (faster-whisper / CTranslate2 layout: model.bin + vocabulary).
    # share_devices: both speech pools set it, so they may use the same card.
    - name: asr
      engine: "asr"
      model: "/models/Systran--faster-whisper-small"
      device_ids: [5]
      share_devices: true
      max_audio_sec: 300             # longest input one transcription accepts
      supported_models:
        - "/models/Systran--faster-whisper-small"
        - "/models/Systran--faster-whisper-medium"

    # Speech synthesis (Kokoro v1.0 layout: kokoro-v1_0.pth + voices/).
    - name: tts
      engine: "tts"
      model: "/models/hexgrad--Kokoro-82M"
      device_ids: [5]
      share_devices: true
      max_chars: 4000                # longest input text one request accepts
      tts_voice: "af_heart"          # voice used when a request names none
      supported_models:
        - "/models/hexgrad--Kokoro-82M"

gateway:
  url: https://openmodel.filfox.info
  gateway_id: openmodel-mainnet
  auto_register: true

  worker_id: ""                # <<< 1-64 chars, starts alphanumeric, then [A-Za-z0-9._-]
  payout_address: ""           # <<< EVM address earnings settle to (0x…)

  public_endpoint: https://<public-ip>:<mapped-inference-port>       # <<<
  public_scheduler_url: https://<public-ip>:<mapped-scheduler-port>  # <<<
  gpu_count: 6                 # <<< cards in use across all pools

  # Every model any pool serves: each pool's resident model and every switch
  # target. Each claim is admitted separately before real traffic routes to it.
  # Entries absent from disk are fetched in the background at start-up.
  supported_models:
    - "/models/Qwen--Qwen3-32B-AWQ"
    - "/models/Qwen--Qwen3-VL-8B-Instruct"
    - "/models/stabilityai--stable-diffusion-xl-base-1.0"
    - "/models/segmind--SSD-1B"
    - "/models/Systran--faster-whisper-small"
    - "/models/Systran--faster-whisper-medium"
    - "/models/hexgrad--Kokoro-82M"

  token_path: /data/gateway-token.json   # written by the scheduler on registration
  tls_system_ca: true                    # the gateway above has a publicly-trusted certificate

  mtls_front:
    enabled: true
    cert_dir: /data/mtls
    inference_port: 38443      # local listen port
    scheduler_port: 39443      # local listen port

