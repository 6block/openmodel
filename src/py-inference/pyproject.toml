[project]
name = "openmodel-inference"
version = "1.5.0"
description = "OpenModel AI inference service for Filecoin Storage Providers"
requires-python = ">=3.10"
dependencies = [
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
    "protobuf>=4.25.0",
    "fastapi>=0.109.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.27.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
gpu = [
    "vllm>=0.22.1",
]
# Image generation and speech engines (installed by the Dockerfile; see its comments for
# the version constraints).
multimodal = [
    "diffusers==0.39.0",
    "accelerate==1.10.1",
    "faster-whisper==1.2.1",
    "soundfile==0.14.0",
    "kokoro==0.9.4",
    "misaki[en,zh]==0.9.4",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
