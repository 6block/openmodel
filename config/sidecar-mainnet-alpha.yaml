# OpenModel — mainnet alpha onboarding config (gateway side prefilled).
# Fill only the fields marked "<<<". Everything else is preset for the
# mainnet alpha gateway — see the onboarding guide for details.

mode: prod   # self-registration requires a real Lotus client; do not change

lotus:
  api_url: "http://127.0.0.1:1234/rpc/v0"
  api_token: "${LOTUS_API_TOKEN}"   # WalletSign needs a sign-permission token; set it in .env
  miner_address: ""            # <<< miner id, e.g. t01234 / f01234

curio:
  # One DSN string (split db_host/db_port keys do not exist in the config
  # struct; YAML drops unknown keys silently — with them, proof detection and
  # WinningPoSt monitoring stay OFF without any warning).
  dsn: "host=localhost port=5433 user=yugabyte dbname=yugabyte sslmode=disable search_path=curio"
  proof_poll_interval_sec: 5
  proof_max_wait_sec: 1800
  log_path: "/tmp/curio.log"

scheduler:
  window_post:
    graceful_yield_threshold_sec: 300
    hard_stop_threshold_sec: 120
    resume_delay_after_close_sec: 60
    yield_during_fault_cutoff: false
    proof_detection_enabled: true
  winning_post:
    enabled: true            # block wins yield the GPU immediately (proof has seconds)
    resume_delay_sec: 30
    timeout_sec: 35
  fail_safe_on_disconnect: true

grpc:
  port: 50051

inference:
  engine: "vllm"
  model: "/models/Qwen--Qwen3-4B-Instruct-2507"   # boot model (smallest, fastest first serve); other claimed entries load on demand
  api_port: 8000
  # Defaults match the reference fleet shape: 8x 10 GB cards (e.g. RTX 3080) as
  # ONE tensor-parallel engine — the only 10 GB shape that serves the FULL
  # five-model catalog (27B and 32B need tp=8 there). Different hardware: trim
  # gateway.supported_models per the onboarding guide's model table and resize
  # here to match — e.g. one 24 GB card: gpu_count 1, device_ids [0], drop 27B;
  # a single 10 GB card: 4B only, max_model_len 4096, gpu_memory_utilization 0.93.
  gpu_memory_utilization: 0.90
  max_model_len: 8192
  enforce_eager: true          # required for the big entries on 10 GB cards (skips CUDA graphs, saves VRAM)
  multi_gpu:
    mode: "tensor_parallel"
    gpu_count: 8               # <<< set to your GPU count
    device_ids: [0, 1, 2, 3, 4, 5, 6, 7]   # <<< and the matching device ids

# --- Gateway (mainnet alpha) — prefilled; edit only the "<<<" fields ---
gateway:
  url: https://openmodel.filfox.info
  gateway_id: openmodel-mainnet
  auto_register: true

  worker_id: ""                # <<< 1-64 chars, starts alphanumeric, then [A-Za-z0-9._-]; e.g. sp-alpha-01
  payout_address: ""           # <<< EVM address earnings settle to (0x…)

  # Gateway-facing addresses of this worker's two TLS fronts. Ports here are
  # the PUBLIC mapped ports; local listen ports are set under mtls_front.
  public_endpoint: https://<public-ip>:<mapped-inference-port>       # <<<
  public_scheduler_url: https://<public-ip>:<mapped-scheduler-port>  # <<<

  # Production catalog v1. Weights need NOT be pre-placed: entries absent from
  # disk are fetched automatically (boot model at first start, the rest in the
  # background) through the FOC registry below. Claim what your hardware can
  # actually serve — every entry is probed before real traffic routes to it.
  # Default: claim the FULL production catalog. Trim to what your hardware can
  # actually serve (see the model table in the onboarding guide) — every claimed
  # entry is downloaded to disk, and a claim your engine shape cannot load fails
  # its switch with a clean error.
  supported_models:
    - "/models/Qwen--Qwen3-4B-Instruct-2507"   # qwen3-4b    fp16  ~8G   1x24G or 2x10G
    - "/models/Qwen--Qwen3-8B"                 # qwen3-8b    fp16  ~16G  1x24G or 4x10G
    - "/models/openai--gpt-oss-20b"            # gpt-oss-20b mxfp4 ~13G  1x24G or 2-4x10G
    - "/models/Qwen--Qwen3-32B-AWQ"            # qwen3-32b   awq   ~19G  1x24G (tight) or 4-8x10G
    - "/models/Qwen--Qwen3.8-27B-FP8"          # qwen3.8-27b fp8   ~28G  8x10G (tp=8)

  token_path: /data/gateway-token.json   # written by the scheduler on registration
  # The gateway URL above is a real domain behind a publicly-trusted
  # certificate, so the system trust store validates it — no CA file to place:
  tls_system_ca: true

  mtls_front:
    enabled: true
    cert_dir: /data/mtls
    inference_port: 38443      # local listen port
    scheduler_port: 39443      # local listen port

foc:
  backend: "real"
  real:
    bridge_url: "http://127.0.0.1:3100"
    # Mainnet piece-CID registry for the production catalog. Keys are HF ids;
    # path-form claims (/models/Org--Name) resolve to the same entries. CID
    # order is upload order — parts are concatenated in this exact order.
    # (sha256 digests for 8B/20B/32B/27B pending — pinned at the next
    #  module-download verification, same as the 4B precedent below)
